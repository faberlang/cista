[package]
name = "cista"
version = "0.1.0"
edition = "2024"
description = "Faber package-store and runtime binding library and CLI"
license = "MIT"
readme = "README.md"

[profile.dev]
debug = 1
codegen-units = 256

[profile.test]
debug = 1
codegen-units = 256

[lib]
name = "cista"
path = "src/lib.rs"

[[bin]]
name = "cista"
path = "src/bin/cista.rs"

[workspace.lints.clippy]
pedantic = "deny"

[lints]
workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
tar = "0.4.44"
ureq = { version = "3.1.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
hygiene-ratchet = { path = "crates/hygiene-ratchet" }
tempfile = "3"

[workspace]
members = ["crates/hygiene-ratchet"]
exclude = ["examples"]
